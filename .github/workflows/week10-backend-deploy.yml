name: Week 10 Backend Deployment & Live Healthcheck

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'assignments/week10/**'
      - '.github/workflows/week10-backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Owner Name (Required for GHCR)
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/logos-log-backend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/logos-log-backend:${{ github.sha }}
          # Docker Layer Caching (GitHub Actions cache backend)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-and-verify:
    name: Deploy to Render & Verify Health
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook (Zero-Downtime deploy)
        if: env.DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render webhook..."
          curl -S -f "$DEPLOY_HOOK"
          echo "Deploy hook triggered successfully."
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Live Uptime & Health Check
        if: env.LIVE_URL != ''
        run: |
          chmod +x ./assignments/week10/scripts/healthcheck.sh
          # Run the healthcheck script against the live backend URL
          ./assignments/week10/scripts/healthcheck.sh "$LIVE_URL" 20 15
        env:
          LIVE_URL: ${{ secrets.RENDER_BACKEND_URL }}
