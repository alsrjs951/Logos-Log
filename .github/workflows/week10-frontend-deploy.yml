name: Week 10 Frontend Deployment & PR Preview

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/week10-frontend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Deploy to Vercel (Preview or Production)
        id: vercel-deploy
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Production deployment on push to main branch
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
          working-directory: ./frontend

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && steps.vercel-deploy.outputs.preview-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel-deploy.outputs.preview-url }}';
            const issue_number = context.issue.number;
            const body = `🚀 **Vercel Deploy Preview Ready!**\n\n🔍 Live Preview URL: [${url}](${url})\n\n*Deployed automatically by GitHub Actions.*`;
            
            // Fetch list of comments to find if a preview comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            const existingComment = comments.find(c => c.body.includes('Vercel Deploy Preview Ready!'));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              console.log('Updated existing PR comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body
              });
              console.log('Created new PR comment.');
            }
